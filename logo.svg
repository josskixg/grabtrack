<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Squircle background -->
  <rect width="512" height="512" rx="120" fill="#0a0f1a"/>

  <!-- G — Grab green, constructed from arcs + horizontal bar, no curves AI-slop -->
  <!-- Outer arc of G (3/4 circle, opens to the right) -->
  <path d="M 352 168 A 112 112 0 1 0 352 344"
        fill="none" stroke="#00b14f" stroke-width="36" stroke-linecap="round"/>
  <!-- Horizontal cross-bar of G -->
  <line x1="256" y1="256" x2="352" y2="256"
        stroke="#00b14f" stroke-width="36" stroke-linecap="round"/>

  <!-- T — white, clean straight lines -->
  <!-- Vertical stroke of T -->
  <line x1="256" y1="200" x2="256" y2="384"
        stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
  <!-- Horizontal top bar of T -->
  <line x1="192" y1="200" x2="320" y2="200"
        stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
</svg>
